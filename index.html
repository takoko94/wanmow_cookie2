<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">
<title>わんも～Cafe クッキー</title>

<style>

@font-face{
  font-family:'PandaBakery';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:1280px;
  height:720px;
  overflow:hidden;
  position:relative;
  font-family:'PandaBakery',sans-serif;
}

.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.08);
}

.logo{
  position:absolute;
  top:20px;
  left:20px;
  height:120px;
}

.title{
  position:absolute;
  top:25px;
  left:0;
  width:100%;

  text-align:center;

  font-size:72px;

  color:#ff7a9f;

  text-shadow:
  0 3px 0 rgba(255,255,255,0.95),
  0 0 18px rgba(255,255,255,0.9),
  0 0 35px rgba(255,180,220,0.45);
}

.subtitle{
  position:absolute;
  top:105px;
  left:0;
  width:100%;

  text-align:center;

  font-size:26px;

  color:#7a4214;
}

.cookieWrap{

  position:absolute;

  top:145px;
  left:40px;
  right:40px;

  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:18px;
}

.cookieCard{

  height:180px;

  border-radius:30px;

  background:
  linear-gradient(
    180deg,
    rgba(255,255,255,0.78),
    rgba(255,255,255,0.55)
  );

  border:2px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;

  padding:12px;

  box-shadow:
  0 10px 24px rgba(0,0,0,0.12);

}

.cookieImg{

  width:150px;
  height:150px;

  object-fit:contain;
}

.cookieName{

  flex:1;

  text-align:center;

  font-size:36px;

  color:#6b3400;

  text-shadow:
  0 2px 0 rgba(255,255,255,0.9);

}

.bottom{

  position:absolute;

  left:40px;
  right:40px;
  bottom:20px;

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:20px;

}

.panel{

  height:150px;

  border-radius:30px;

  background:
  linear-gradient(
    180deg,
    rgba(255,255,255,0.85),
    rgba(255,255,255,0.65)
  );

  border:2px solid rgba(255,255,255,0.8);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
  0 10px 24px rgba(0,0,0,0.12);

}

.coin{

  width:110px;
  margin-right:20px;
}

.gacha{

  width:130px;
  margin-right:20px;
}

.panelTitle{

  font-size:42px;
  color:#7a4214;
  text-align:center;
}

.panelMain{

  font-size:54px;
  color:#ff7a9f;
  text-align:center;
}

.panelSub{

  font-size:24px;
  color:#7a4214;
  text-align:center;
}

.sparkle{

  position:absolute;

  font-size:32px;

  animation:
  float 4s ease-in-out infinite;

}

.s1{
  top:120px;
  left:180px;
}

.s2{
  top:120px;
  right:180px;
}

.s3{
  bottom:190px;
  left:20px;
}

.s4{
  bottom:190px;
  right:20px;
}

@keyframes float{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }

}

</style>
</head>

<body>

<img src="haikei.png" class="bg">
<div class="overlay"></div>

<img src="wanmow_logo.png" class="logo">

<div class="sparkle s1">✨</div>
<div class="sparkle s2">✨</div>
<div class="sparkle s3">🐾</div>
<div class="sparkle s4">🐾</div>

<div class="title">
🍪 推し犬クッキー登場 🍪
</div>

<div class="subtitle">
全6種類販売開始！
</div>

<div class="cookieWrap">

  <div class="cookieCard">
    <img src="cookiePomeranian.png" class="cookieImg">
    <div class="cookieName">ポメラニアン</div>
  </div>

  <div class="cookieCard">
    <img src="cookiehusky.png" class="cookieImg">
    <div class="cookieName">ハスキー</div>
  </div>

  <div class="cookieCard">
    <img src="cookiepug.png" class="cookieImg">
    <div class="cookieName">パグ</div>
  </div>

  <div class="cookieCard">
    <img src="cookiepoodle.png" class="cookieImg">
    <div class="cookieName">プードル</div>
  </div>

  <div class="cookieCard">
    <img src="cookieChihuahua.png" class="cookieImg">
    <div class="cookieName">チワワ</div>
  </div>

  <div class="cookieCard">
    <img src="cookiesiba.png" class="cookieImg">
    <div class="cookieName">柴犬</div>
  </div>

</div>

<div class="bottom">

  <div class="panel">

    <img src="coin.png" class="coin">

    <div>

      <div class="panelTitle">
        コイン交換
      </div>

      <div class="panelMain">
        10枚 → 10個
      </div>

      <div class="panelSub">
        推し犬クッキー10個と交換！
      </div>

    </div>

  </div>

  <div class="panel">

    <img src="gacha.png" class="gacha">

    <div>

      <div class="panelTitle">
        ランダムクッキーガチャ
      </div>

      <div class="panelMain">
        1回 3,000円
      </div>

      <div class="panelSub">
        全6種類・ランダム
      </div>

    </div>

  </div>

</div>

</body>
</html>
